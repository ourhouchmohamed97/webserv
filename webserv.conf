server {
    listen 8080 9090;
    root ./www;
    index index.html;

    client_max_body_size 1000000000;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        root ./www;
        index index.html;
        allow_methods GET POST DELETE;
    }

    location /cgi {
        root ./scripts;
        allow_methods GET POST DELETE;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
    }

    location /www {
        root ./;
        autoindex on;
        allow_methods GET;
    }

    location /upload {
        root ./uploads;
        allow_methods GET POST DELETE;
    }
}