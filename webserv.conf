server {
    listen 8080 9090;
    root ./www;
    index index.html;

    client_max_body_size 1000000;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    upload_path ./uploads;

    location / {
        root ./www;
        index home.html;
        allow_methods GET POST DELETE;
        autoindex on;
        upload_path ./uploads;
        cgi .py /usr/bin/python3;
    }
    location /old {
    redirect 301 /new;
}
}