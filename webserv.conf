server {
    listen 8080 9090;
    root ./www;
    index index.html;
    
    client_max_body_size 1000000000;

    error_page 404 ./errors/404.html;
    error_page 500 ./errors/500.html;

    location / {
        index index.html;
        allow_methods GET  POST DELETE;
        autoindex on;
        client_max_body_size 1000011;
    }
    location /cgi{
        root ./scripts;
        allow_methods GET POST DELETE;
        cgi .py /usr/bin/python3;
        cgi .sh /bin/bash;
        autoindex on;
    }

    location /upload
    {
        root ./uploads;
        allow_methods GET POST DELETE;
    }
}
